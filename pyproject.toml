[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trigate"
version = "0.1.0"
description = "Production-grade OpenAI-compatible LLM gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "aioredis>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.2",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "sentence-transformers>=2.7",
    "numpy>=1.26",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.24",
    "openai>=1.30",
    "anthropic>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "testcontainers>=4",
    "coverage>=7",
    "ruff",
    "mypy",
]
bench = [
    "locust>=2.28",
    "pandas>=2",
    "jupyter>=1",
    "datasets>=2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*", "tests*", "benchmarks*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
