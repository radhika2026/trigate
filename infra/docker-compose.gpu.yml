version: "3.9"

# GPU profile — extends docker-compose.yml with vLLM GPU backends
services:
  vllm-small:
    image: vllm/vllm-openai:latest
    command: ["--model", "meta-llama/Llama-3.2-1B-Instruct", "--port", "8001", "--enable-prefix-caching", "--block-size", "16"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8001:8001"

  vllm-frontier:
    image: vllm/vllm-openai:latest
    command: ["--model", "meta-llama/Llama-3.1-70B-Instruct", "--port", "8002", "--tensor-parallel-size", "4", "--enable-prefix-caching", "--block-size", "16"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
    ports:
      - "8002:8002"
